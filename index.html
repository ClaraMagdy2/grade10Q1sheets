<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Grade 10 Computing - Revision Sheet</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header>
  <div class="container">
    <p class="tag">GRADE 10 • COMPUTING</p>
    <h1>Revision Sheet</h1>
    <p class="subtitle">20 MCQs covering Abstraction, Hardware & Software, Python, Data Structures, Control Structures, and Debugging.</p>
  </div>
</header>

<main class="container">
  <section class="card">
    <div class="instructions">
      <h2>Instructions</h2>
      <p>Choose one answer for each question, then click <strong>Submit & Check Answers</strong>.</p>
    </div>
    <div id="quiz"></div>
    <div class="actions">
      <button id="submitBtn" onclick="checkAnswers()">✓ Submit & Check Answers</button>
      <button id="resetBtn" onclick="resetQuiz()">↻ Try Again</button>
    </div>
    <div id="result" class="result" aria-live="polite"></div>
  </section>
</main>

<footer>
  <p>Grade 12 Computing Revision Sheet • 20 MCQs</p>
</footer>
<script src="app.js"></script>
</body>
</html>
